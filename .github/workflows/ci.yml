name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shared-mime-info
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJ
          sudo install shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck

      - name: ShellCheck
        run: shellcheck -x bin/winapp setup tests/run tests/stubs/*

      - name: JSON files
        run: jq -e . manifest.json catalog.json tests/fixtures/scan.json > /dev/null

      - name: Tests
        run: tests/run
